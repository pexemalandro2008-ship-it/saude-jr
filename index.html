    body = `<section class="card"><p class="muted">Confira se o celular está com internet e tente de novo.</p>${err}
      <button class="btn btn-go btn-block" data-act="authRetry" ${busy}>${a.busy ? 'Tentando…' : 'Tentar de novo'}</button>
      ${su && a.canOffline ? `<button class="btn btn-ghost btn-block" data-act="authOffline">Continuar sem internet</button><p class="tiny faint">Seus registros ficam guardados aqui e vão para a sua conta quando a internet voltar.</p>` : ''}</section>`;
  } else {
    body = `<section class="card">
      <div class="field"><label for="au-email">E-mail</label><input id="au-email" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" value="${esc(a.email)}" placeholder="voce@email.com" data-enter="authSubmit"></div>
      ${pwField('au-pass', 'Senha', 'current-password', 'maxlength="72"')}
      ${err}${info}
      <button class="btn btn-go btn-block" data-act="authLogin" ${busy}>${a.busy ? 'Entrando…' : 'Entrar'}</button>
      <button class="link-btn" data-act="authMode" data-m="forgot">Esqueci a senha</button></section>
      <section class="card card-flat"><div class="between"><span class="small muted">Primeira vez aqui?</span><button class="btn btn-soft btn-sm" data-act="authMode" data-m="signup">Criar conta</button></div></section>`;
  }
  return `<div class="auth">${head}${body}
    <p class="tiny faint center">${icon('lock', 'ic-sm')} Cada conta só enxerga os próprios dados. <button class="link-btn inline" data-act="go" data-to="privacidade">Privacidade e termos</button></p></div>`;
}

const authVal = (id) => (($('#' + id) || {}).value || '');
function authRead() {
  const a = authState();
  if ($('#au-email')) a.email = authVal('au-email').trim();
  if ($('#au-name')) a.name = authVal('au-name').trim();
  // senhas ficam só na memória desta tela (para não precisar digitar de novo depois de um aviso)
  if ($('#au-pass')) a.pw1 = authVal('au-pass');
  if ($('#au-pass2')) a.pw2 = authVal('au-pass2');
  if ($('#au-link')) a.link = authVal('au-link');
  a.showPw = !!($('#au-pass') && $('#au-pass').type === 'text');
}
/** depois de desenhar a tela de conta: devolve o que já estava digitado */
function authAfterRender() {
  const a = ui.auth; if (!a) return;
  const set = (id, v, show) => { const el = document.getElementById(id); if (!el) return; if (v) el.value = v; if (show && el.type === 'password') { el.type = 'text'; const b = document.querySelector(`[data-act="pwToggle"][data-for="${id}"]`); if (b) b.setAttribute('aria-pressed', 'true'); } };
  set('au-pass', a.pw1, a.showPw); set('au-pass2', a.pw2, a.showPw); set('au-link', a.link);
}
function authClearSecrets() { const a = authState(); a.pw1 = ''; a.pw2 = ''; a.link = ''; a.showPw = false; }
function authFail(e) { const a = authState(); a.busy = false; a.error = typeof e === 'string' ? e : Cloud.message(e); render(); }
const PASS_RULE = (p) => (p.length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.' : p.length > 72 ? 'A senha pode ter no máximo 72 caracteres.' : !/[a-zA-ZÀ-ÿ]/.test(p) || !/[0-9]/.test(p) ? 'Use letras e números na senha.' : null);
const EMAIL_OK = (e) => /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[a-z]{2,}$/i.test(e);

const AUTH_ACT = {
  authMode: (d) => { authRead(); authClearSecrets(); const a = authState(); goAuth(d.m, { sent: d.m === 'forgot' ? a.sent : false }); const f = $(d.m === 'signup' ? '#au-name' : d.m === 'newpass' ? '#au-pass' : '#au-email'); if (f) f.focus(); },
  pwToggle: (d, el) => {
    const inp = document.getElementById(d.for); if (!inp) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    el.setAttribute('aria-pressed', String(show)); el.setAttribute('aria-label', show ? 'Esconder senha' : 'Mostrar senha');
  },
  authSubmit: () => {
    const m = authState().mode;
    const map = { login: 'authLogin', signup: 'authSignup', forgot: 'authForgot', newpass: 'authNewPass', offline: 'authRetry' };
    if (map[m]) return AUTH_ACT[map[m]]();
  },
  authLogin: async () => {
    authRead();
    const a = authState(), pass = authVal('au-pass');
    if (!EMAIL_OK(a.email)) return authFail('Confira o e-mail.');
    if (!pass) return authFail('Digite a senha.');
    a.busy = true; a.error = ''; a.info = ''; render();
    try { const s = await Cloud.signIn(a.email, pass); a.busy = false; authClearSecrets(); if (s && s.user) await startUser(s.user); }
    catch (e) { authFail(e); }
  },
  authSignup: async () => {
    authRead();
    const a = authState(), p1 = authVal('au-pass'), p2 = authVal('au-pass2');
    if (!a.name) return authFail('Diga como quer ser chamado.');
    if (!EMAIL_OK(a.email)) return authFail('Confira o e-mail.');
    const rule = PASS_RULE(p1); if (rule) return authFail(rule);
    if (p1 !== p2) return authFail('As duas senhas não são iguais.');
    a.busy = true; a.error = ''; render();
    try { const s = await Cloud.signUp({ name: a.name, email: a.email, password: p1 }); a.busy = false; authClearSecrets(); if (s && s.user) await startUser(s.user, { fresh: true }); }
    catch (e) { authFail(e); }
  },
  authForgot: async () => {
    authRead();
    const a = authState();
    if (!EMAIL_OK(a.email)) return authFail('Confira o e-mail.');
    a.busy = true; a.error = ''; a.info = ''; render();
    try { await Cloud.requestReset(a.email); a.busy = false; a.sent = true; a.info = 'Pronto. Se houver uma conta com esse e-mail, o link chega em alguns minutos.'; render(); }
    catch (e) { authFail(e); }
  },
  authRecover: async () => {
    authRead();
    const a = authState(), link = authVal('au-link');
    if (!link.trim()) return authFail('Cole o link do e-mail de recuperação.');
    a.busy = true; a.error = ''; render();
    try {
      a.recovering = true;
      const s = await Cloud.useRecovery(link);
      a.busy = false; authClearSecrets();
      if (s && s.user) await startUser(s.user);
      goAuth('newpass', { recovering: true });
    } catch (e) { a.recovering = false; authFail(e); }
  },
  authNewPass: async () => {
    authRead();
    const a = authState(), p1 = authVal('au-pass'), p2 = authVal('au-pass2');
    const rule = PASS_RULE(p1); if (rule) return authFail(rule);
    if (p1 !== p2) return authFail('As duas senhas não são iguais.');
    a.busy = true; a.error = ''; render();
    try {
      await Cloud.updatePassword(p1);
      a.busy = false; a.recovering = false; authClearSecrets();
      ui.route = ui.user && prof().onboarded ? 'home' : 'onboarding';
      if (ui.route === 'onboarding') obInit();
      render(); toast('Senha nova salva');
    } catch (e) { authFail(e); }
  },
  authRetry: async () => { const a = authState(); a.busy = true; render(); await bootCloud(true); },
  authOffline: () => {
    const su = Cloud.storedUser();
    if (!su || !Store.useCacheOffline(su.id)) return authFail('Não há dados guardados neste aparelho. Conecte-se à internet para entrar.');
    ui.user = su; ui.offlineUser = true;
    ui.route = prof().onboarded ? 'home' : 'onboarding';
    if (ui.route === 'onboarding') obInit();
    render(); toast('Sem internet: registros ficam guardados aqui');
  },

  /* conta (perfil) */
  askLogout: () => {
    const pend = Store.pending + pendingPhotoCount();
    openSheet('confirm', {
      title: 'Sair da conta?',
      text: pend ? `Há ${pend} registro${pend === 1 ? '' : 's'} ainda não enviado${pend === 1 ? '' : 's'} para a sua conta. Conecte-se à internet antes de sair, ou eles ficam só neste aparelho até você entrar de novo.` : 'Seus dados continuam guardados na sua conta. Para voltar, é só entrar com e-mail e senha.',
      ok: 'doLogout', okLabel: 'Sair', danger: !!pend,
    });
  },
  doLogout: async () => {
    closeSheet();
    toast('Saindo…');
    const synced = await Promise.race([Store.sync(), new Promise((r) => setTimeout(() => r(false), 6000))]);
    const wipe = synced && !pendingPhotoCount();
    await clearPhotoCache();
    try { localStorage.removeItem('mv1:run'); } catch (e) { /* ok */ }
    Store.close({ wipe });
    await Cloud.signOut();
    ui.user = null; ui.userStarted = null;
    try { location.replace(location.pathname); } catch (e) { goAuth('login'); }
  },
  changePass: () => openSheet('senha'),
  savePass: async () => {
    const p1 = ($('#np-1') || {}).value || '', p2 = ($('#np-2') || {}).value || '';
    const rule = PASS_RULE(p1); if (rule) return toast(rule);
    if (p1 !== p2) return toast('As duas senhas não são iguais');
    const b = $('#np-save'); if (b) { b.disabled = true; b.textContent = 'Salvando…'; }
    try { await Cloud.updatePassword(p1); closeSheet(); toast('Senha alterada'); }
    catch (e) { if (b) { b.disabled = false; b.textContent = 'Salvar nova senha'; } toast(Cloud.message(e)); }
  },
};

/* ---------------- início com conta ---------------- */
async function startUser(user, opts) {
  if (!user || !user.id) return;
  const meta = user.user_metadata || {};
  ui.user = { id: user.id, email: user.email || '', name: meta.name || '' };
  ui.offlineUser = false;
  if (ui.userStarted === user.id && ui.startP) {
    await ui.startP;
    if (ui.auth && ui.auth.recovering) { ui.route = 'auth'; ui.auth.mode = 'newpass'; safeRender(); } else afterStart();
    return;
  }
  ui.userStarted = user.id;
  ui.startP = (async () => {
    if (Store.mode !== 'boot' && Store.mode !== 'cached') Store.close({ wipe: false });
    ui.photoStore = Cloud.photos(user.id);
    if (!Store.ids().length) Store.hydrateFromCache(user.id);
    await Store.init({ uid: user.id, backend: Cloud.db(user.id) });
    cleanupStale();
  })();
  await ui.startP;
  if (opts && opts.fresh) toast('Conta criada');
  if (ui.auth && ui.auth.recovering) { ui.route = 'auth'; ui.auth.mode = 'newpass'; render(); return; }
  afterStart();
  uploadPendingPhotos();
}
function afterStart() {
  if (!prof().onboarded) { if (ui.route !== 'onboarding') { obInit(); ui.route = 'onboarding'; } }
  else if (['splash', 'auth', 'onboarding'].includes(ui.route)) { ui.route = (ui.run && ui.run.active) ? 'corrida' : 'home'; applyDeepLink(); }
  safeRender();
  tickReminders();
}

/** abre o app publicado: sessão salva → dados; sem sessão → tela de entrar */
async function bootCloud(retry) {
  const su = Cloud.storedUser();
  if (!retry) {
    // voltou pelo link do e-mail de recuperação?
    const hash = location.hash || '';
    const recovering = /[#&]type=recovery/.test(hash);
    if (recovering) { const a = authState(); a.recovering = true; a.mode = 'newpass'; }
    else if (/[#&](error_code|error_description)=/.test(hash)) {
      goAuthLater = { mode: 'forgot', error: /otp_expired|expired/i.test(hash) ? 'O link expirou ou já foi usado. Peça um novo.' : 'Não foi possível usar esse link. Peça um novo.' };
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ok */ }
    }
    const had = su && !recovering ? Store.hydrateFromCache(su.id) : false;
    if (su && !recovering) ui.user = su;
    ui.route = recovering ? 'splash' : su && had && prof().onboarded ? ((ui.run && ui.run.active) ? 'corrida' : 'home') : su ? 'splash' : 'auth';
    if (ui.route === 'home') applyDeepLink();
    if (goAuthLater && ui.route === 'auth') { Object.assign(authState(), goAuthLater); goAuthLater = null; }
    render();
  }
  try { await Cloud.connect(); }
  catch (e) {
    const canOffline = !!(su && Store.useCacheOffline(su.id));
    if (canOffline && !retry) { ui.offlineUser = true; ui.route = prof().onboarded ? ui.route === 'splash' ? 'home' : ui.route : 'onboarding'; if (ui.route === 'onboarding') obInit(); render(); return; }
    return goAuth('offline', { canOffline, error: Cloud.message(e) });
  }
  if (!ui.authSub) {
    const sub = Cloud.onChange((event, session) => setTimeout(() => onAuthEvent(event, session), 0));
    ui.authSub = sub || true;
  }
  let session = null, err = null;
  try { session = await Cloud.session(); } catch (e) { err = e; }
  if (session && session.user) return startUser(session.user);
  if (err && su && Store.useCacheOffline(su.id)) { ui.offlineUser = true; if (ui.route === 'splash') ui.route = prof().onboarded ? 'home' : 'onboarding'; render(); return; }
  if (ui.auth && ui.auth.recovering) { ui.auth.recovering = false; ui.user = null; return goAuth('forgot', { error: 'O link expirou ou já foi usado. Peça um novo.' }); }
  ui.user = null;
  if (su) Store.close({ wipe: false }); // sessão expirada: nada de mostrar dados sem entrar de novo
  const a = authState(), extra = goAuthLater || {};
  goAuthLater = null;
  goAuth(extra.mode || (a.mode === 'offline' || a.mode === 'newpass' ? 'login' : a.mode || 'login'), extra);
}
let goAuthLater = null;

function onAuthEvent(event, session) {
  if (event === 'PASSWORD_RECOVERY') {
    const a = authState(); a.recovering = true;
    if (session && session.user) startUser(session.user).then(() => goAuth('newpass', { recovering: true }));
    else goAuth('newpass', { recovering: true });
    return;
  }
  if (event === 'SIGNED_IN' && session && session.user) { if (ui.userStarted !== session.user.id) startUser(session.user); return; }
  if (event === 'SIGNED_OUT') {
    if (ui.userStarted) {
      Store.close({ wipe: false });
      ui.user = null; ui.userStarted = null;
      goAuth('login', { info: 'Sua sessão terminou. Entre de novo para continuar.' });
    }
  }
  if (event === 'USER_UPDATED' && session && session.user && ui.user) ui.user.email = session.user.email || ui.user.email;
}

/* ---------------- entradas ao vivo ---------------- */
function cardioCalc() {
  const kind = pressedIn('cd-kind') || 'esteira';
  const min = L.num(($('#cd-min') || {}).value), km = L.num(($('#cd-km') || {}).value), spd = L.num(($('#cd-spd') || {}).value);
  const rpeEl = $('#cd-rpe'); if (!rpeEl) return;
  const rpe = Number(rpeEl.value);
  $('#cd-rpe-v').textContent = rpe; $('#cd-rpe-t').textContent = C.RPE(rpe);
  const speed = spd || (km && min ? km / (min / 60) : null);
  if (!spd && speed) $('#cd-spd').placeholder = `≈ ${fmt1(speed)}`;
  const kcal = L.kcal(L.cardioMET(kind, speed, rpe), curWeight(), min);
  $('#cd-kcal').placeholder = kcal ? `≈ ${fmt0(kcal)} kcal` : 'automático';
  $('#cd-kcal-h').textContent = rpe >= 9 ? 'Nesta fase, prefira esforço entre 3 e 6: sustentável e seguro.' : 'Estimativa pelo tipo, tempo, esforço e seu peso. Se o aparelho mostrar, use o valor dele.';
}
function readMarmitaForm() {
  const g = (id) => ($('#' + id) || {}).value;
  return {
    name: (g('mm-name') || '').trim(),
    protFood: g('mm-p-f') || null, protG: L.num(g('mm-p-g')), protOther: (g('mm-p-o') || '').trim(),
    carbFood: g('mm-c-f') || null, carbG: L.num(g('mm-c-g')), carbOther: (g('mm-c-o') || '').trim(),
    vegFood: g('mm-v-f') || null, vegG: L.num(g('mm-v-g')), vegOther: (g('mm-v-o') || '').trim(),
    qty: L.num(g('mm-qty')), kcal: L.num(g('mm-kcal')), prot: L.num(g('mm-prot')),
  };
}
function mmPreview() {
  const m = readMarmitaForm();
  ['mm-p', 'mm-c', 'mm-v'].forEach((id) => { const o = $('#' + id + '-o'), f = $('#' + id + '-f'); if (o && f) o.hidden = f.value !== 'outro'; });
  const box = $('#mm-prev'); if (!box) return;
  if (!m.protFood && !m.carbFood && !m.vegFood && m.kcal == null) { box.innerHTML = ''; return; }
  const tot = L.marmitaTotals(m, C.FOODS), chk = L.marmitaCheck(m, tot);
  box.innerHTML = `<div class="note ${chk.level === 'ok' ? 'go' : 'warn'}">${icon(chk.level === 'ok' ? 'check' : 'info')}<div class="stack-sm"><b>${tot.kcal != null ? `≈ ${fmt0(tot.kcal)} kcal · ${fmt0(tot.prot)} g de proteína` : 'Calorias: informe os gramas ou o rótulo'}</b>${chk.tips.length ? chk.tips.map((t) => `<span class="small">${esc(t)}</span>`).join('') : '<span class="small">Composição equilibrada.</span>'}</div></div>`;
}
function setCmp(v) { const c = $('#cmp'); if (c) c.style.setProperty('--x', v + '%'); const r = $('#cmp-r'); if (r && String(r.value) !== String(Math.round(v))) r.value = Math.round(v); }
function bindCompare() {
  const c = $('#cmp'); if (!c) return;
  const move = (e) => { const b = c.getBoundingClientRect(); setCmp(L.clamp(((e.clientX - b.left) / b.width) * 100, 0, 100)); };
  c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); move(e); });
  c.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'touch') move(e); });
}
const INP = {
  sleepCalc: () => { const h = L.sleepHours($('#sl-bed').value, $('#sl-wake').value); $('#sl-h').textContent = h != null ? fmt1(h) + ' h' : '—'; },

  cmpSlide: (el) => setCmp(Number(el.value)),
  rlRpe: (el) => { const v = Number(el.value), a = $('#rl-rpe-v'), b = $('#rl-rpe-t'); if (a) a.textContent = v; if (b) b.textContent = C.RPE(v); },
  rlPain: () => { const f = $('#rl-area-f'); if (f) f.hidden = !(Number(pressedIn('rl-pain') || 0) >= 1); },
  spWhen: (el) => { const f = $('#sp-time-f'); if (f) f.hidden = el.value !== 'hora'; },

/* ---------------- água, peso e registros ---------------- */
function addWater(ml) {
  const k = today(), day = dayW(k), g = prof().waterGoal;
  const before = day.water || 0;
  day.water = before + ml;
  day.waterLog = (day.waterLog || []).concat(ml).slice(-60);
  save(monthId(k));
  render();
  toast(before < g && day.water >= g ? 'Meta de água batida!' : `+${fmt0(ml)} ml · ${fmt0(day.water)} ml hoje`);
}
function dayUpdate(fn, msg) { const k = today(); fn(dayW(k)); save(monthId(k)); render(); if (msg) toast(msg); }

/* ---------------- sessão de treino ---------------- */
const S = () => activeSession();
const itemOf = (d) => { const s = S(); return s ? s.items[Number(d.i)] : null; };
function nextOpen(s, from) {
  for (let j = from + 1; j < s.items.length; j++) if (!s.items[j].done) return j;
  for (let j = 0; j < s.items.length; j++) if (!s.items[j].done) return j;
  return -1;
}
function startSession(type) {
  const ex = activeSession();
  if (ex) { ui.route = 'sessao'; ui.openEx = nextOpen(ex, -1); closeSheet(); render(); wakeLock(true); return; }
  const s = buildSession(type);
  MON(s.date).sessions.push(s);
  save(monthId(s.date));

/* ---------------- limpeza e inicialização ---------------- */
function cleanupStale() {
  const k = today(), changed = [];
  for (const id of Store.ids().filter((x) => /^m-/.test(x))) {
    const m = Store.peek(id);
    if (!m || !m.sessions) continue;
    let dirty = false;
    m.sessions = m.sessions.filter((s) => {
      if (s.completed || s.date === k) return true;
      dirty = true;
      if (s.items.some((it) => it.sets.some((x) => x.done))) { s.completed = true; s.partial = true; s.finishedAt = s.finishedAt || s.startedAt + 3600000; return true; }
      return false;
    });
    if (dirty) changed.push(id);
  }
  if (changed.length) save(...changed);
}
function dayRollover() {
  const k = today();
  if (ui.day && ui.day !== k) { invalidate(); if (ui.route !== 'sessao') safeRender(); }
  ui.day = k;

  document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !isTyping() && !ui.sheet) { pendingRender = false; render(); } }, 0); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    dayRollover(); tickReminders();
    if (ui.route === 'sessao' || (ui.run && ui.run.active)) wakeLock(true);
    runTick();
    if (ui.route === 'home') safeRender();
    if (CLOUD) cloudRefresh();
  });
  Store.on('status', () => {
    const [cls, label] = syncInfo();
    document.querySelectorAll('.top-btn .dot').forEach((d) => { d.className = 'dot ' + cls; });
    const l = document.getElementById('syncLabel'); if (l) l.textContent = label;
  });
  Store.on('remote', () => { invalidate(); safeRender(); });

  ui.day = today();
  // sessão de corrida em andamento sobrevive a recarregar a página
  try {
    const saved = JSON.parse(localStorage.getItem('mv1:run') || 'null');
    if (saved && saved.startedAt && Date.now() - saved.startedAt < 8 * 3600000) { ui.run = saved; ui.runResult = saved.active ? null : saved.result || null; }
    else if (saved) localStorage.removeItem('mv1:run');
  } catch (e) { /* sem armazenamento local */ }
  const startRoute = () => (ui.run && ui.run.active ? 'corrida' : 'home');
  setTimeout(() => { if (ui.route === 'splash') { ui.splashSlow = true; render(); } }, CLOUD ? 9000 : 5000);
  if (CLOUD) {
    // app publicado: conta com e-mail e senha (Supabase)
    bootCloud().catch((e) => { console.error(e); goAuth('offline', { canOffline: false, error: Cloud.message(e) }); });
    if (ui.run && ui.run.active) { gpsStart(); wakeLock(true); }
    window.addEventListener('online', () => { if (ui.offlineUser) bootCloud(true); else cloudRefresh(); });
    setInterval(() => { if (!document.hidden) cloudRefresh(); }, 90000);
  }
  const had = CLOUD ? false : Store.hydrateFromCache();
  if (had && prof().onboarded) { cleanupStale(); ui.route = startRoute(); applyDeepLink(); }
  if (!CLOUD) {
    render();
    if (ui.run && ui.run.active) { gpsStart(); wakeLock(true); }
  }
  if (!CLOUD) Store.init().then(async (mode) => {
    const u = Store.user;
    if (u) {
      try { ui.owner = await u.isOwner(); } catch (e) { ui.owner = null; }
      try { ui.me = await u.me(); } catch (e) { ui.me = null; }
    }
    cleanupStale();
    if (!prof().onboarded) { if (ui.route !== 'onboarding') { obInit(); ui.route = 'onboarding'; } }
    else if (ui.route === 'splash' || ui.route === 'onboarding') { ui.route = startRoute(); applyDeepLink(); }
    safeRender();
    if (mode === 'cloud') getCap('assets');
    tickReminders();
  }).catch((e) => { console.error(e); if (ui.route === 'splash') { obInit(); ui.route = 'onboarding'; render(); } });
  setInterval(tickReminders, 20000);
  setInterval(() => { const el = document.getElementById('sessClock'); if (el) { const s = activeSession(); if (s) el.textContent = clockText(s); } }, 1000);
  setInterval(dayRollover, 30000);
  setInterval(runTick, 250);
  if (PWA) {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      const hadController = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.register('sw.js').catch(() => {});
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) toast('Saúde Jr. atualizado'); });
    }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); ui.installEvt = e; if (ui.route === 'instalar' || ui.route === 'home') safeRender(); });
    window.addEventListener('appinstalled', () => { ui.installEvt = null; toast('Saúde Jr. instalado'); safeRender(); });
  }
}
/** app publicado: busca o que mudou em outro aparelho e envia fotos pendentes */
let lastRefresh = 0;
function cloudRefresh() {
  if (!CLOUD || Store.mode !== 'cloud' || Date.now() - lastRefresh < 20000) return;
  lastRefresh = Date.now();
  Store.pull().then(() => uploadPendingPhotos()).catch(() => {});
}
/** atalhos do ícone (?go=agenda | fotos | corrida) */
function applyDeepLink() {
  let to = null;
  try { to = new URLSearchParams(location.search).get('go'); } catch (e) { to = null; }
  if (!to || ui.deepDone || (ui.run && ui.run.active)) return;
  ui.deepDone = true;
  if (to === 'agenda') ui.route = 'agenda';
  else if (to === 'fotos') { ui.sub.evolucao = 'fotos'; ui.route = 'evolucao'; }
  else if (to === 'corrida') { ui.sub.treino = 'corrida'; ui.route = 'treino'; }
  else if (to === 'comida') ui.route = 'comida';
}
Object.assign(ACT, AUTH_ACT);
boot();

})();</script>
